services:
  dockerregistry:
    container_name: quollix_dockerregistry_dockerregistry
    image: registry:3.1.2@sha256:01cd312e67026f06f5d89c3e133a4a9adc7cb9eeb9b1194e0b2954dfd770efd2
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
    volumes:
      - quollix_dockerregistry_data:/var/lib/registry
    configs:
      - source: registry
        target: /etc/distribution/config.yml
    labels:
      quollix.port: 5000

volumes:
  quollix_dockerregistry_data: null

configs:
  registry:
    content: |
      version: 0.1
      log:
        formatter: json
      storage:
        filesystem:
          rootdirectory: /var/lib/registry
        delete:
          enabled: true
      proxy:
        remoteurl: https://registry-1.docker.io
