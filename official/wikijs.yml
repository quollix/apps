services:
  postgres:
    container_name: quollix_wikijs_postgres
    image: postgres:17.5-alpine3.22@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD: "${SECRET_POSTGRES_PASSWORD}"
    volumes:
      - quollix_wikijs_postgres:/var/lib/postgresql/data

  wikijs:
    container_name: quollix_wikijs_wikijs
    image: ghcr.io/requarks/wiki:2.5.316@sha256:fffff288a52f76e5b8c19a4fbcd0f3e538e96edea642c4f2d813d54d59a876de
    depends_on:
      - postgres
    environment:
      DB_TYPE: postgres
      DB_HOST: quollix_wikijs_postgres
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: "${SECRET_POSTGRES_PASSWORD}"
      DB_NAME: wiki
      LOG_FORMAT: json
      LOG_LEVEL: info
    labels:
      quollix.port: 3000

volumes:
  quollix_wikijs_postgres: null
