services:
  wgeasy:
    container_name: quollix_wgeasy_wgeasy
    image: ghcr.io/wg-easy/wg-easy:15.4.0@sha256:0e7bc9d34e86ddcaa92bc700d4d7dc9b33291dbc07ac8d13382f7c2095f949ec
    environment:
      INSECURE: true
    volumes:
      - quollix_wgeasy_wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.src_valid_mark: 1
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv6.conf.all.forwarding: 1
      net.ipv6.conf.default.forwarding: 1
    ports:
      - "51820:51820/udp"
    labels:
      quollix.port: 51821
    networks:
      - quollix_wgeasy
    restart: unless-stopped

volumes:
  quollix_wgeasy_wireguard:
    name: quollix_wgeasy_wireguard

networks:
  quollix_wgeasy:
    external: true
