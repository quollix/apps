services:
  hedgedoc:
    image: quay.io/hedgedoc/hedgedoc:1.12.0-alpine@sha256:90beb0d2da2cab217b4512e520cb74e6a861e522a06d33c208cf54b52e9ef48b
    container_name: quollix_hedgedoc_hedgedoc
    depends_on:
      - postgres
    environment:
      CMD_DB_URL: postgres://hedgedoc:${SECRET_POSTGRES_PASSWORD}@postgres:5432/hedgedoc
      CMD_DOMAIN: hedgedoc.${BASE_DOMAIN}
      CMD_PROTOCOL_USESSL: "true"
      CMD_URL_ADDPORT: "false"
      CMD_SESSION_SECRET: "${SECRET_SESSION_SECRET}"

      CMD_ALLOW_EMAIL_REGISTER: "false"
      CMD_EMAIL: "false"
      CMD_ALLOW_ANONYMOUS: "false"

      CMD_OAUTH2_PROVIDERNAME: "Quollix"
      CMD_OAUTH2_CLIENT_ID: "${CLIENT_ID}"
      CMD_OAUTH2_CLIENT_SECRET: "${CLIENT_SECRET}"
      CMD_OAUTH2_SCOPE: "openid email profile"

      CMD_OAUTH2_USER_PROFILE_USERNAME_ATTR: "sub"
      CMD_OAUTH2_USER_PROFILE_DISPLAY_NAME_ATTR: "name"
      CMD_OAUTH2_USER_PROFILE_EMAIL_ATTR: "email"

      CMD_OAUTH2_AUTHORIZATION_URL: "https://quollix.${BASE_DOMAIN}/api/authorize"
      CMD_OAUTH2_TOKEN_URL:         "https://quollix.${BASE_DOMAIN}/api/token"
      CMD_OAUTH2_USER_PROFILE_URL:  "https://quollix.${BASE_DOMAIN}/api/userinfo"
    volumes:
      - quollix_hedgedoc_uploads:/hedgedoc/public/uploads
    labels:
      quollix.port: 3000

  postgres:
    image: postgres:17.5-alpine3.22@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    container_name: quollix_hedgedoc_postgres
    environment:
      POSTGRES_USER: hedgedoc
      POSTGRES_PASSWORD: "${SECRET_POSTGRES_PASSWORD}"
      POSTGRES_DB: hedgedoc
    volumes:
      - quollix_hedgedoc_postgres:/var/lib/postgresql/data

volumes:
  quollix_hedgedoc_postgres: null
  quollix_hedgedoc_uploads: null
