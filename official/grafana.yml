services:
  postgres:
    container_name: quollix_grafana_postgres
    image: postgres:17.5-alpine3.22@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    environment:
      POSTGRES_DB: grafana
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: "${SECRET_POSTGRES_PASSWORD}"
    volumes:
      - quollix_grafana_postgres:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    container_name: quollix_grafana_grafana
    depends_on:
      - postgres
      - victorialogs
      - victoriametrics
    environment:
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: quollix_grafana_postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: "${SECRET_POSTGRES_PASSWORD}"
      GF_LOG_CONSOLE_FORMAT: json
      GF_PLUGINS_PREINSTALL_SYNC: victoriametrics-logs-datasource@0.32.0
      GF_SERVER_ROOT_URL: "https://grafana.${BASE_DOMAIN}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"

      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Quollix
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "${CLIENT_ID}"
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "${CLIENT_SECRET}"
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email offline_access"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://quollix.${BASE_DOMAIN}/api/authorize"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://quollix.${BASE_DOMAIN}/api/token"
      GF_AUTH_GENERIC_OAUTH_API_URL: "https://quollix.${BASE_DOMAIN}/api/userinfo"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "role == 'admin' && 'GrafanaAdmin' || 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: "true"
    volumes:
      - quollix_grafana_grafana:/var/lib/grafana
    configs:
      - source: datasources
        target: /etc/grafana/provisioning/datasources/victoria.yaml
    labels:
      quollix.port: 3000

  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d
    container_name: quollix_grafana_victorialogs
    command:
      - -httpAuth.username=admin
      - -httpAuth.password=${SECRET_VICTORIALOGS_PASSWORD}
      - -loggerFormat=json
      - -delete.enable
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=${LOGS_RETENTION_DAYS}d
      - -retention.maxDiskSpaceUsageBytes=${LOGS_MAX_DISK_SPACE_GB}GB
    volumes:
      - quollix_grafana_victorialogs:/victoria-logs-data

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.154.0@sha256:4bd592341587d669b7f57d54bbb82bd21ac8675f4e24234b7703a7c0f85197d8
    container_name: quollix_grafana_victoriametrics
    command:
      - -httpAuth.username=admin
      - -httpAuth.password=${SECRET_VICTORIAMETRICS_PASSWORD}
      - -loggerFormat=json
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=${METRICS_RETENTION_DAYS}d
    volumes:
      - quollix_grafana_victoriametrics:/victoria-metrics-data

  vector:
    image: timberio/vector:0.59.0-debian@sha256:98e7b4dfe50750e61470697bbd2fbeca643d12bea97f351005038ef506eab630
    container_name: quollix_grafana_vector
    hostname: quollix-host
    depends_on:
      - victorialogs
      - victoriametrics
    environment:
      PROCFS_ROOT: /host/proc
      SYSFS_ROOT: /host/sys
    command: [--config, /etc/vector/vector.yaml, --log-format, json]
    volumes:
      - /:/host:ro,rslave
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - quollix_grafana_vector:/var/lib/vector
    configs:
      - source: vector
        target: /etc/vector/vector.yaml

volumes:
  quollix_grafana_grafana: null
  quollix_grafana_postgres: null
  quollix_grafana_victorialogs: null
  quollix_grafana_victoriametrics: null
  quollix_grafana_vector: null

configs:
  vector:
    content: |
      data_dir: /var/lib/vector
      sources:
        host_journal:
          type: journald
          current_boot_only: true
          extra_args: [--merge]
        host_metrics:
          type: host_metrics
          collectors: [cpu, memory, filesystem]
          scrape_interval_secs: ${HOST_METRICS_INTERVAL_SECONDS}
          # Host network traffic is omitted because Quollix does not allow host networking.
          filesystem:
            mountpoints:
              includes: [/host, /host/**]
              excludes: [/host/dev/**, /host/proc/**, /host/sys/**, /host/var/lib/docker/**, /host/var/lib/containerd/**]
            filesystems:
              excludes: [autofs, binfmt_misc, cgroup, cgroup2, debugfs, devpts, devtmpfs, fusectl, mqueue, overlay, proc, pstore, securityfs, sysfs, tracefs]
      sinks:
        victoriametrics:
          type: prometheus_remote_write
          inputs: [host_metrics]
          endpoint: http://victoriametrics:8428/api/v1/write
          # The write endpoint returns 204, which Vector's startup healthcheck rejects.
          healthcheck:
            enabled: false
          auth:
            strategy: basic
            user: admin
            password: "${SECRET_VICTORIAMETRICS_PASSWORD}"
        victorialogs:
          type: http
          inputs: [host_journal]
          uri: "http://victorialogs:9428/insert/jsonline?_stream_fields=source_type,host,_SYSTEMD_UNIT&_msg_field=message&_time_field=timestamp"
          auth:
            strategy: basic
            user: admin
            password: "${SECRET_VICTORIALOGS_PASSWORD}"
          compression: gzip
          encoding:
            codec: json
          framing:
            method: newline_delimited
          acknowledgements:
            enabled: true
          healthcheck:
            enabled: false
  datasources:
    content: |
      apiVersion: 1
      datasources:
        - name: VictoriaLogs
          uid: VictoriaLogs
          type: victoriametrics-logs-datasource
          access: proxy
          url: http://victorialogs:9428
          basicAuth: true
          basicAuthUser: admin
          secureJsonData:
            basicAuthPassword: "${SECRET_VICTORIALOGS_PASSWORD}"
          isDefault: true
          editable: true
        - name: VictoriaMetrics
          uid: VictoriaMetrics
          type: prometheus
          access: proxy
          url: http://victoriametrics:8428
          basicAuth: true
          basicAuthUser: admin
          secureJsonData:
            basicAuthPassword: "${SECRET_VICTORIAMETRICS_PASSWORD}"
          isDefault: false
          editable: true
