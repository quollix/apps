force_image:
  # When upgrading PostgreSQL to 18 or newer, update app volume mounts from /var/lib/postgresql/data to /var/lib/postgresql.
  postgres: 17.5-alpine3.22
  mariadb: 11.4.12
  redis: 8.6-alpine3.23
  # Grist 1.7.18 moved official OIDC support from the Community Edition to Full Grist.
  gristlabs/grist-oss: 1.7.17
  # RabbitMQ should be bound to the Zulip version. When upgrading Zulip, check the official Zulip Docker Compose and Helm values for the compatible RabbitMQ version:
  # https://raw.githubusercontent.com/zulip/docker-zulip/12.1-0/compose.yaml
  # https://raw.githubusercontent.com/zulip/docker-zulip/12.1-0/helm/zulip/values.yaml
  rabbitmq: 4.3.2-alpine
